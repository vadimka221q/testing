<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xerg Motion Reel</title>
<style>
@font-face{font-family:'Inter Tight';src:url(fonts/intertight.woff2) format('woff2');font-weight:100 900;font-display:block}
@font-face{font-family:'Space Mono';src:url(fonts/spacemono.woff2) format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'Space Mono';src:url(fonts/spacemono-bold.woff2) format('woff2');font-weight:700;font-display:block}
:root{--black:#0C0C0C;--nero:#262626;--scar:#404040;--zinc:#5a5a5a;--cam:#196f43;--vegan:#219359;--jade:#2AB36C;--dragon:#54c38a;--pjade:#7ED3A8;--mint:#F4FFF7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050505;color:#eee;overflow:hidden;font-family:'Inter Tight',system-ui,sans-serif}
#viewport{position:fixed;left:0;right:0;top:0;bottom:64px}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden;background:var(--black);transform-origin:0 0}
body.render #viewport{bottom:0}
body.render #bar{display:none}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.abs{position:absolute}
.disp{font-family:'Inter Tight';font-weight:500;line-height:1;white-space:nowrap;letter-spacing:-.035em}
.mono{font-family:'Space Mono',monospace}
.ch{display:inline-block;will-change:transform}
.lens{position:absolute;overflow:hidden}
.photo{position:absolute;left:0;top:0;width:1280px;height:720px;object-fit:cover;transform-origin:50% 50%}
.fit svg,.fit{display:block}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}

/* corner brackets — the reticle, applied */
.bx{position:absolute}
.bk{position:absolute;width:var(--bl,16px);height:var(--bl,16px);border:0 solid var(--mint)}
.bk::after{content:'';position:absolute;width:var(--bs,7px);height:var(--bs,7px);background:var(--mint)}
.bk.tl{left:0;top:0;border-top-width:var(--bw,1.5px);border-left-width:var(--bw,1.5px)}
.bk.tr{right:0;top:0;border-top-width:var(--bw,1.5px);border-right-width:var(--bw,1.5px)}
.bk.bl{left:0;bottom:0;border-bottom-width:var(--bw,1.5px);border-left-width:var(--bw,1.5px)}
.bk.br{right:0;bottom:0;border-bottom-width:var(--bw,1.5px);border-right-width:var(--bw,1.5px)}
.bk.tl::after{left:calc(var(--bs,7px)/-2 - var(--bw,1.5px)/2);top:calc(var(--bs,7px)/-2 - var(--bw,1.5px)/2)}
.bk.tr::after{right:calc(var(--bs,7px)/-2 - var(--bw,1.5px)/2);top:calc(var(--bs,7px)/-2 - var(--bw,1.5px)/2)}
.bk.bl::after{left:calc(var(--bs,7px)/-2 - var(--bw,1.5px)/2);bottom:calc(var(--bs,7px)/-2 - var(--bw,1.5px)/2)}
.bk.br::after{right:calc(var(--bs,7px)/-2 - var(--bw,1.5px)/2);bottom:calc(var(--bs,7px)/-2 - var(--bw,1.5px)/2)}
.lbl{position:absolute;left:0;top:-21px;font:11px 'Space Mono',monospace;color:var(--mint);white-space:nowrap;letter-spacing:.02em}

/* S1 */
#s1 .cam{position:absolute;inset:0;transform-origin:640px 360px}
#s1flash{position:absolute;inset:0;background:var(--jade);display:none}
.tag{position:absolute;height:20px;background:var(--jade);color:var(--black);font:700 9.5px/20px 'Space Mono',monospace;padding:0 9px;letter-spacing:.04em;white-space:nowrap}
.focus{position:absolute;border:1.5px solid var(--dragon);color:var(--mint);font:13px/1 'Space Mono',monospace;padding:5px 8px 4px;letter-spacing:.04em;transform:translateX(-50%)}
.spec{position:absolute;font:6.4px/1.4 'Space Mono',monospace;color:#9aa39d;white-space:pre}

/* S3 */
#s3{background:var(--jade)}
.card{position:absolute}
.card .img{position:absolute;inset:0;overflow:hidden;background:var(--black)}
.card .img > *,.card .img > * > *{position:absolute}
.pal{inset:0;display:flex}
.pal i{flex:1}
.aa{inset:0;display:grid;place-items:center;color:var(--mint);font:500 92px/1 'Inter Tight';letter-spacing:-.04em}
.aa small{position:absolute;left:10px;bottom:9px;font:9px 'Space Mono';color:var(--dragon);letter-spacing:0}

/* S5 */
#s5{background:var(--black);background-image:linear-gradient(#171717 1px,transparent 1px),linear-gradient(90deg,#171717 1px,transparent 1px);background-size:64px 64px;background-position:0 40px}
.cell{position:absolute;width:63px;height:63px}
.wordW{position:absolute;color:var(--mint);font-size:188px}
#s5trace{position:absolute;inset:0;display:none;background:#070807;background-image:linear-gradient(#141614 1px,transparent 1px),linear-gradient(90deg,#141614 1px,transparent 1px);background-size:22px 22px}
.tl{position:absolute;font:8px 'Space Mono',monospace;color:#c9d2cc;letter-spacing:.06em;text-transform:uppercase}
#s5flash{position:absolute;inset:0;display:none;background:var(--jade)}

/* S7 */
#s7{background:var(--black)}
.glow{position:absolute;left:0;right:0;bottom:0;height:720px;background:linear-gradient(to top,rgba(42,179,108,.55),rgba(25,111,67,.25) 35%,rgba(12,12,12,0) 70%)}

/* UI */
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;background:#0a0a0a;border-top:1px solid #1f1f1f;font:12px 'Space Mono',monospace;color:#9aa39d}
#bar button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border:1px solid #333;border-radius:50%;color:#fff}
#bar button:hover{border-color:var(--jade)}
#bar input{flex:1;accent-color:var(--jade)}
#bar .brand{color:var(--mint);letter-spacing:.08em}
</style>
<script src="assets/assets.js"></script>
</head>
<body>
<div id="viewport"><div id="stage">
  <div class="scene" id="s1"><div class="cam"></div><div id="s1flash"></div></div>
  <div class="scene" id="s2"></div>
  <div class="scene" id="s3"></div>
  <div class="scene" id="s4a"></div>
  <div class="scene" id="s4b"></div>
  <div class="scene" id="s5"></div>
  <div class="scene" id="s6"></div>
  <div class="scene" id="s7"></div>
  <canvas id="fx" width="1280" height="720"></canvas>
</div></div>
<div id="bar">
  <button id="play" aria-label="Play / pause">❚❚</button>
  <span id="time">0.00s</span>
  <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0" aria-label="Timeline">
  <span class="brand">XERG · BRAND IDENTITY · SOLLAS</span>
</div>
<script>
/* ============================================================
   XERG — brand identity reel (Sollas)
   Everything is a pure function of time: render(t).
   Brand assets live in assets/ (not committed) — see README.
   ============================================================ */
const W=1280,H=720,FPS=30,DUR=9.2;
const C={black:'#0C0C0C',nero:'#262626',scar:'#404040',zinc:'#5a5a5a',cam:'#196f43',vegan:'#219359',jade:'#2AB36C',dragon:'#54c38a',pjade:'#7ED3A8',mint:'#F4FFF7'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),
  inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  outCubic:x=>1-Math.pow(1-x,3),
  inCubic:x=>x*x*x,
  inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  outBack:x=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(a,b=0,c=0){let h=Math.imul((a|0)^0x9e3779b9,0x85ebca6b)^Math.imul((b|0)+0x632be5ab,0xc2b2ae35)^Math.imul((c|0)+0x27d4eb2f,0x165667b1);h^=h>>>15;h=Math.imul(h,0x2c1b3c6d);h^=h>>>12;h=Math.imul(h,0x297a2d39);h^=h>>>15;return (h>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return lerp(lerp(a,b,u),lerp(c,d,u),v)}
const $=(sel,root=document)=>root.querySelector(sel);
const $$=(sel,root=document)=>[...root.querySelectorAll(sel)];
function el(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
function place(e,x,y,w,h){const s=e.style;s.left=x+'px';s.top=y+'px';if(w!=null)s.width=w+'px';if(h!=null)s.height=h+'px'}
function show(e,on){e.style.display=on?'block':'none'}
function letters(e){const txt=e.textContent;e.textContent='';return [...txt].map(c=>el('span','ch',e,c===' '?'&nbsp;':c))}
const lerpR=(a,b,q)=>({x:lerp(a.x,b.x,q),y:lerp(a.y,b.y,q),w:lerp(a.w,b.w,q),h:lerp(a.h,b.h,q)});
function brackets(parent,vars=''){const b=el('div','bx',parent);if(vars)b.style.cssText=vars;['tl','tr','bl','br'].forEach(k=>el('i','bk '+k,b));return b}

/* ---------------- brand marks from the supplied logo SVG ---------------- */
const LOGO=(()=>{const doc=new DOMParser().parseFromString(ASSETS.logo,'image/svg+xml');const ps=[...doc.querySelectorAll('path')].map(p=>p.getAttribute('d'));
  return {tri:[ps[0],ps[1]],g:ps[2],e:ps[3],x:ps[4],r:ps[5],box:{x:[247,395],e:[383,506],r:[514,610],g:[596,737]}}})();
const GRAD={
  brand:`<linearGradient id="xg0" x1="134.086" y1="80" x2="12.3036" y2="80" gradientUnits="userSpaceOnUse"><stop stop-color="#124D2F"/><stop offset="1" stop-color="#2AB36C"/></linearGradient><linearGradient id="xg1" x1="114.285" y1="24.1584" x2="189.533" y2="157.228" gradientUnits="userSpaceOnUse"><stop stop-color="#2AB36C"/><stop offset="1" stop-color="#0F1D16"/></linearGradient>`,
  white:`<linearGradient id="xw0" x1="134" y1="80" x2="12" y2="80" gradientUnits="userSpaceOnUse"><stop stop-color="#cfe9da"/><stop offset="1" stop-color="#ffffff"/></linearGradient><linearGradient id="xw1" x1="114" y1="24" x2="190" y2="157" gradientUnits="userSpaceOnUse"><stop stop-color="#F4FFF7"/><stop offset="1" stop-color="#6f8f7c"/></linearGradient>`,
};
let UID=0;
function markSVG(v='brand'){const base=v==='brand'?'xg':'xw',id=base+'_'+(UID++)+'_';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 209.2 160" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"><defs>${GRAD[v].replace(new RegExp(`id="${base}`,'g'),`id="${id}`)}</defs><path d="${LOGO.tri[0]}" fill="url(#${id}0)"/><path d="${LOGO.tri[1]}" fill="url(#${id}1)"/></svg>`}
function glyphSVG(k,fill){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 737 198" width="100%" height="100%" style="overflow:visible"><path fill-rule="evenodd" d="${LOGO[k]}" fill="${fill}"/></svg>`}
// a full-size logo-space layer holding one glyph; positioned by logo origin + scale
function glyphEl(parent,k,fill){const e=el('div','abs fit',parent,glyphSVG(k,fill));e.style.width='737px';e.style.height='198px';e.style.transformOrigin='0 0';return e}
function illSVG(k,vb='164 63 480 480'){return ASSETS[k].replace(/<svg([^>]*?)width="\d+" height="\d+" viewBox="[^"]*"/,`<svg$1width="100%" height="100%" viewBox="${vb}"`)}

/* ---------------- pixel effects ---------------- */
// triangle mark rasterised analytically (N columns across)
function pixelMark(ctx,cx,cy,w,{color=C.mint,color2=null,p=1,gap=.14,seed=1,jitter=0,t=0,N=34}={}){
  const h=w*160/209.2,cs=w/N,rows=Math.round(h/cs),fr=Math.floor(t*30);
  for(let j=0;j<rows;j++)for(let i=0;i<N;i++){const u=(i+.5)/N,v=(j+.5)/rows;if(Math.abs(u-.5)*2>v)continue;if(hash(i,j,seed)>p)continue;
    let x=cx-w/2+i*cs,y=cy-h/2+j*cs;if(jitter&&hash(j,fr,seed)<.3)x+=(hash(i,j,fr)-.5)*jitter;
    ctx.fillStyle=color2&&u>.5?color2:color;ctx.fillRect(x,y,cs*(1-gap),cs*(1-gap))}
}
function pixelWipe(ctx,p,{cell=16,seed=1,mode='white',exclude=[]}={}){
  if(p<=0)return;
  for(let y=0;y<H;y+=cell)for(let x=0;x<W;x+=cell){
    const cxn=x/cell,cyn=y/cell,v=vnoise(cxn*.11,cyn*.11,seed)*.72+hash(cxn,cyn,seed)*.28;
    if(v>p*1.08)continue;
    if(exclude.some(r=>x+cell>r.x&&x<r.x+r.w&&y+cell>r.y&&y<r.y+r.h))continue;
    if(mode==='green'){ctx.fillStyle=C.jade;ctx.fillRect(x,y,cell,cell);continue}
    const q=vnoise(cxn*.23,cyn*.23,seed+9);
    if(q<.42){ctx.fillStyle=C.mint;ctx.fillRect(x,y,cell,cell);ctx.fillStyle=C.black;ctx.fillRect(x,y+4,cell,1.6);ctx.fillRect(x,y+10,cell,1.6)}
    else if(q<.62){ctx.fillStyle=C.black;ctx.fillRect(x,y,cell,cell);ctx.fillStyle=C.dragon;for(let a=0;a<2;a++)for(let b=0;b<2;b++)ctx.fillRect(x+3+a*8,y+3+b*8,2.6,2.6)}
    else{ctx.fillStyle=C.mint;ctx.fillRect(x,y,cell,cell)}
  }
}

/* ============================ BUILD ============================ */
const S={};
const WORD={ox:148.5,oy:381}; // logo-space origin of the S1 wordmark
function buildS1(){
  const cam=$('#s1 .cam');
  const X0=475,X1=805,Y0=195,Y1=525,CX=640,CY=360;
  const ln=(x1,y1,x2,y2,c,o='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1" ${o}/>`;
  const L='rgba(244,255,247,.28)';
  let svg=`<svg class="abs" width="1280" height="720" style="left:0;top:0;overflow:visible">`;
  svg+=`<g class="rl" style="transform-origin:640px 195px">${ln(CX,-300,CX,Y0,L)}${ln(560,Y0,720,Y0,L)}</g>`;
  svg+=`<g class="rl" style="transform-origin:640px 525px">${ln(CX,Y1,CX,1000,L)}${ln(560,Y1,720,Y1,L)}</g>`;
  svg+=`<g class="rl" style="transform-origin:475px 360px">${ln(-300,CY,X0,CY,L)}${ln(X0,290,X0,430,L)}</g>`;
  svg+=`<g class="rl" style="transform-origin:805px 360px">${ln(X1,CY,1600,CY,L)}${ln(X1,290,X1,430,L)}</g>`;
  svg+=`<rect class="fsq" x="555" y="258" width="170" height="170" fill="none" stroke="rgba(84,195,138,.55)" stroke-width="1.2"/>`;
  svg+=`<g class="xh">${ln(624,292,656,292,'rgba(84,195,138,.8)')}${ln(640,278,640,292,'rgba(84,195,138,.8)')}<circle cx="640" cy="292" r="5" fill="${C.jade}" stroke="${C.dragon}"/></g>`;
  svg+=`<path class="tri" d="M633 322h14l-7 8z" fill="${C.mint}"/>`;
  svg+=`<g class="ticks">${Array.from({length:15},(_,i)=>`<line class="tk" x1="${584+i*8}" x2="${584+i*8}" y1="392" y2="${i%2?404:408}" stroke="rgba(84,195,138,.7)" stroke-width="1.2"/>`).join('')}</g></svg>`;
  cam.insertAdjacentHTML('beforeend',svg);
  const focus=el('div','focus',cam,'FOCUS');place(focus,640,346);
  const frame=brackets(cam,'--bl:30px;--bs:10px;--bw:2px');
  const mark=el('div','abs fit',cam,markSVG('brand'));place(mark,575,280,130,100);
  const word=['x','e','r','g'].map(k=>glyphEl(cam,k,C.mint));
  const lens=el('div','lens',cam);lens.style.background=`linear-gradient(${C.black} 0%,${C.cam} 38%,${C.jade} 62%,${C.mint} 100%)`;
  const lmark=el('div','abs fit',lens,markSVG('white'));
  const lword=['x','e','r','g'].map(k=>glyphEl(lens,k,C.black));
  const tag=el('div','tag',cam,'IDENTITY_01');place(tag,475,592);
  const spec=el('div','spec',cam,'');place(spec,836,262);
  S.s1={cam,rl:$$('.rl',cam),fsq:$('.fsq',cam),xh:$('.xh',cam),tri:$('.tri',cam),tks:$$('.tk',cam),focus,frame,mark,word,lens,lmark,lword,tag,spec,
    specTxt:'PROJECT: XERG\nTYPE: BRAND IDENTITY\nROLE: CONTROL PLANE\nFOR: AGENT ECONOMICS\nSTATE: LIVE\nGRID: 64PX MODULE\nCAPTURE: FOCUS\nSTUDIO: SOLLAS'};
}
function photoXform(t){const p=P(t,1.4,2.55);return `translate(${lerp(-14,10,E.outCubic(p))}px,${lerp(18,0,E.outCubic(p))}px) scale(${lerp(1.2,1.04,E.outCubic(p))})`}
const LENS=[{x:500,y:40,w:250,h:180,n:'Module_01',t:1.56},{x:842,y:92,w:190,h:150,n:'Module_02',t:1.64},{x:450,y:462,w:370,h:160,n:'Module_03',t:1.8},{x:130,y:318,w:210,h:150,n:'Module_04',t:1.72}];
const NEG='grayscale(1) invert(1) contrast(1.45) brightness(1.08)';
function negLayer(parent){const w=el('div','abs',parent);w.style.cssText='left:0;top:0;width:1280px;height:720px;isolation:isolate';
  const im=el('img','photo',w);im.src='assets/hoodie.jpg';im.style.filter=NEG;
  const tint=el('div','abs',w);tint.style.cssText=`inset:0;background:${C.pjade};mix-blend-mode:multiply`;return {w,im}}
function buildS2(){
  const s=$('#s2');const img=el('img','photo',s);img.src='assets/hoodie.jpg';
  const lenses=LENS.map(L=>{const lens=el('div','lens',s);const neg=negLayer(lens);
    const box=brackets(s);el('div','lbl',box,L.n);const edge=el('div','abs',box);edge.style.cssText='inset:0;border:1px solid rgba(244,255,247,.55)';
    return {lens,neg,box,L}});
  const r=rng(77);
  S.s2={s,img,lenses,
    boxes:Array.from({length:30},()=>({x:80+r()*1100,y:30+r()*640,w:16+r()*80,h:10+r()*34,a:1.42+r()*.5,d:.25+r()*.5,lab:r()<.45,v:r()})),
    parts:Array.from({length:200},()=>({x:r()*1280,y:r()*720,s:.8+r()*1.6,k:r()}))};
}
// Card layouts; LAY_B lines each card up with its glyph in the final lockup.
const LOCK={ox:272,oy:261};
const CARDS=[{n:'Mark',kind:'mark',from:0},{n:'Palette',kind:'palette',from:1},{n:'Type',kind:'type',from:2},{n:'Reticle',kind:'reticle',from:3},{n:'Merch.',kind:'merch',from:-1}];
const LAY_A=[{x:196,y:232,w:196,h:190},{x:398,y:262,w:196,h:188},{x:598,y:296,w:170,h:196},{x:772,y:276,w:160,h:228},{x:936,y:248,w:156,h:222}];
const LAY_B=[{x:252,y:230,w:249,h:212},{x:506,y:246,w:158,h:190},{x:668,y:262,w:120,h:172},{x:792,y:248,w:100,h:196},{x:896,y:276,w:134,h:204}];
const GLY=[{k:'x',t:3.5},{k:'e',t:3.58},{k:'r',t:3.66},{k:'g',t:3.76}];
function cardContent(img,kind){
  if(kind==='mark'){const m=el('div','fit',img,markSVG('brand'));m.style.cssText='left:14%;top:18%;width:72%;height:64%';
    const w=el('div','fit',m,markSVG('white'));w.style.cssText='position:absolute;inset:0;opacity:0';m.white=w;return m}
  if(kind==='palette'){el('div','pal',img,[C.black,C.nero,C.scar,C.cam,C.vegan,C.jade,C.dragon,C.pjade,C.mint].map(c=>`<i style="background:${c}"></i>`).join(''));return null}
  if(kind==='type'){el('div','aa',img,'Aa<small>SPACE MONO / 0123</small>');return null}
  const im=el('img','',img);im.src=kind==='reticle'?'assets/reticle.jpg':'assets/cap.jpg';im.style.cssText=`inset:0;width:100%;height:100%;object-fit:cover;object-position:${kind==='reticle'?'50% 45%':'42% 30%'}`;return null;
}
function buildS3(){
  const s=$('#s3');
  s.insertAdjacentHTML('beforeend',`<svg class="abs guides" width="1280" height="720" style="left:0;top:0">
    <line x1="0" y1="230" x2="1280" y2="230" stroke="rgba(244,255,247,.5)" stroke-dasharray="5 5"/>

const isRender=new URLSearchParams(location.search).has('render');
if(isRender)document.body.classList.add('render');
function fit(){if(isRender)return;const v=$('#viewport'),k=Math.min(v.clientWidth/W,v.clientHeight/H);
  const st=$('#stage');st.style.transform=`scale(${k})`;st.style.left=(v.clientWidth-W*k)/2+'px';st.style.top=(v.clientHeight-H*k)/2+'px'}
window.addEventListener('resize',fit);
window.__DUR=DUR;window.__render=render;
(async()=>{
  buildS1();buildS2();buildS3();buildS4();buildS5();buildS6();buildS7();
  await Promise.all([document.fonts.load('500 100px "Inter Tight"'),document.fonts.load('600 100px "Inter Tight"'),document.fonts.load('10px "Space Mono"'),document.fonts.load('700 10px "Space Mono"'),
    ...$$('img').map(im=>im.decode().catch(()=>{}))]);
  await document.fonts.ready;
  fit();render(0);window.__ready=true;
  if(isRender)return;
  let playing=true,t0=performance.now(),cur=0;
  const btn=$('#play'),scrub=$('#scrub'),lbl=$('#time');
  const set=t=>{cur=t;render(t);scrub.value=t/DUR;lbl.textContent=t.toFixed(2)+'s'};
  const loop=now=>{if(playing)set(((now-t0)/1000)%DUR);requestAnimationFrame(loop)};requestAnimationFrame(loop);
  const toggle=()=>{playing=!playing;btn.textContent=playing?'❚❚':'▶';if(playing)t0=performance.now()-cur*1000};
  btn.onclick=toggle;
  scrub.oninput=()=>{playing=false;btn.textContent='▶';set(scrub.value*DUR)};
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}
    if(e.code==='ArrowRight'||e.code==='ArrowLeft'){playing=false;btn.textContent='▶';set(clamp(cur+(e.code==='ArrowRight'?1:-1)/FPS,0,DUR-1/FPS))}});
})();
</script>
</body>
</html>
