<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xerg Shapes Loop</title>
<style>
@font-face{font-family:'Space Mono';src:url(../xerg-motion/fonts/spacemono.woff2) format('woff2');font-weight:400;font-display:block}
:root{--black:#0C0C0C;--jade:#2AB36C;--mint:#F4FFF7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050505;overflow:hidden}
#viewport{position:fixed;left:0;right:0;top:0;bottom:64px;display:grid;place-items:center}
#c{display:block;width:min(100vw,calc((100vh - 64px)*16/9));aspect-ratio:16/9;height:auto}
body.render #viewport{bottom:0;place-items:start}
body.render #c{width:1280px}
body.render #bar{display:none}
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;background:#0a0a0a;border-top:1px solid #1f1f1f;font:12px 'Space Mono',monospace;color:#9aa39d}
#bar button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border:1px solid #333;border-radius:50%;color:#fff}
#bar button:hover{border-color:var(--jade)}
#bar input{flex:1;accent-color:var(--jade)}
</style>
<script src="../xerg-motion/assets/assets.js"></script>
</head>
<body>
<div id="viewport"><canvas id="c"></canvas></div>
<div id="bar">
  <button id="play" aria-label="Play / pause">❚❚</button>
  <span id="time">0.00s</span>
  <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0" aria-label="Timeline">
  <span style="color:#F4FFF7;letter-spacing:.08em">XERG · SHAPES</span>
</div>
<script>
/* ============================================================
   xerg — grainy shapes (16:9)
   A pure function of time: render(t) draws the whole frame on one canvas.
   ============================================================ */
const W=1280,H=720,CX=640,CY=360,FPS=30,DUR=5.85,SHIFT=.35; // lines/grid scenes are authored 0.35s later than they play
const C={black:'#0C0C0C',nero:'#262626',scar:'#404040',zinc:'#5a5a5a',deep:'#0f1d16',forest:'#124D2F',cam:'#196f43',vegan:'#219359',jade:'#2AB36C',dragon:'#54c38a',pjade:'#7ED3A8',mint:'#F4FFF7'};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
// CSS-style cubic-bezier easing
function bezier(x1,y1,x2,y2){
  const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const sx=t=>((ax*t+bx)*t+cx)*t,sy=t=>((ay*t+by)*t+cy)*t,dx=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{if(x<=0)return 0;if(x>=1)return 1;let t=x;
    for(let i=0;i<8;i++){const e=sx(t)-x,d=dx(t);if(Math.abs(e)<1e-6||Math.abs(d)<1e-6)break;t-=e/d}
    if(Math.abs(sx(t)-x)>1e-4){let lo=0,hi=1;t=x;for(let i=0;i<40;i++){if(sx(t)<x)lo=t;else hi=t;t=(lo+hi)/2}}
    return sy(t)};
}
const E={
  settle:bezier(.16,1,.3,1),        // fast out, very long glide
  whip:bezier(.8,0,.12,1),          // hold, whip, glide — used for cuts between states
  pop:bezier(.34,1.56,.64,1),       // soft overshoot for things appearing
  anticip:bezier(.6,-.28,.74,.05),  // pull back, then accelerate away (scatter)
  drift:bezier(.45,0,.55,1),
  inHard:bezier(.7,0,.84,0),
  blast:bezier(.5,0,.18,1),         // sharp S — the scatter
};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(a,b=0,c=0){let h=Math.imul((a|0)^0x9e3779b9,0x85ebca6b)^Math.imul((b|0)+0x632be5ab,0xc2b2ae35)^Math.imul((c|0)+0x27d4eb2f,0x165667b1);h^=h>>>15;h=Math.imul(h,0x2c1b3c6d);h^=h>>>12;h=Math.imul(h,0x297a2d39);h^=h>>>15;return (h>>>0)/4294967296}
const $=s=>document.querySelector(s);
const cv=$('#c'),DPR=window.devicePixelRatio||1;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
const ctx=cv.getContext('2d');

/* ---------------- grainy gradient textures ---------------- */
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function rampAt(st,t){const n=st.length-1,x=t*n,i=Math.min(n-1,Math.floor(x)),f=x-i,a=st[i],b=st[i+1];return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f]}
// Paint a shape (path in local px, 0..w × 0..h) with a stippled gradient — the "grain" look.
// grad: lin (angle a), rad (cx,cy,r in fractions) or fn (px,py)->{t,st} for per-pixel control.
function tex({w,h,path,grad={type:'lin',a:0},ramp,grain=.3,seed=1}){
  const Wp=Math.ceil(w*DPR),Hp=Math.ceil(h*DPR),m=document.createElement('canvas');m.width=Wp;m.height=Hp;
  const mc=m.getContext('2d');mc.scale(DPR,DPR);mc.fillStyle='#fff';mc.beginPath();path(mc,w,h);mc.fill();
  const id=mc.getImageData(0,0,Wp,Hp),d=id.data,r=rng(seed),st=ramp&&ramp.map(hex);
  const ca=Math.cos((grad.a||0)*Math.PI/180),sa=Math.sin((grad.a||0)*Math.PI/180),half=(Math.abs(w*ca)+Math.abs(h*sa))/2;
  for(let y=0;y<Hp;y++)for(let x=0;x<Wp;x++){const i=(y*Wp+x)*4,al=d[i+3];if(!al)continue;
    const px=x/DPR,py=y/DPR;let t,s=st;
    if(grad.type==='fn'){const g=grad.fn(px,py);t=g.t;s=g.st}
    else if(grad.type==='rad')t=Math.hypot(px-grad.cx*w,py-grad.cy*h)/(grad.r*Math.max(w,h));
    else t=((px-w/2)*ca+(py-h/2)*sa)/half*.5+.5;
    t=clamp(t+(r()+r()-1)*grain);
    const c=rampAt(s,t);d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];
    if(al<255)d[i+3]=r()*255<al?255:0;
  }
  mc.setTransform(1,0,0,1,0,0);mc.putImageData(id,0,0);m.w=w;m.h=h;return m;
}
const rect=(c,w,h)=>c.rect(0,0,w,h);
const circ=(c,w,h)=>c.ellipse(w/2,h/2,w/2,h/2,0,0,Math.PI*2);
const poly=pts=>(c,w,h)=>{c.moveTo(pts[0][0]*w,pts[0][1]*h);pts.slice(1).forEach(p=>c.lineTo(p[0]*w,p[1]*h));c.closePath()};
function starPts(n,inner,seed){const r=rng(seed),pts=[];for(let i=0;i<n*2;i++){const a=i/(n*2)*Math.PI*2-Math.PI/2,R=i%2?inner*(.85+r()*.3):(.82+r()*.18);pts.push([.5+Math.cos(a)*R/2,.5+Math.sin(a)*R/2])}return pts}
const bean=(c,w,h)=>{c.ellipse(w*.5,h*.28,w*.42,h*.26,.3,0,Math.PI*2);c.moveTo(w*.9,h*.62);c.ellipse(w*.5,h*.66,w*.4,h*.3,-.2,0,Math.PI*2)};
// The xerg mark, one texture for both faces (no seam), with the exact brand gradients
// from the logo SVG, mapped into the 209.2×160 logo space.
const MARK_L=[C.forest,C.jade].map(hex),MARK_R=[C.jade,C.deep].map(hex);
function markTex(w,h,grain,seed){
  return tex({w,h,path:poly([[.5,0],[1,1],[0,1]]),grain,seed,grad:{type:'fn',fn:(px,py)=>{const lx=px*209.2/w,ly=py*160/h;
    if(lx<104.58)return {t:(lx-134.086)/(12.3036-134.086),st:MARK_L};
    const ax=114.285,ay=24.1584,bx=189.533-ax,by=157.228-ay;return {t:((lx-ax)*bx+(ly-ay)*by)/(bx*bx+by*by),st:MARK_R}}}});
}

/* ---------------- scene data ---------------- */
let T={};
// A — window with sliding grain bars (bars in fractions of the window)
const LAYOUTS=[
  {t:[0,.36],win:{x:330,y:228,w:620,h:265},bars:[[0,0,1,.045,[C.pjade,C.jade],-1],[.09,.166,.91,.21,[C.mint,C.pjade,C.jade,C.cam],1],[0,.52,.645,.21,[C.zinc,C.pjade,C.mint],-1],[.463,.864,.537,.136,[C.cam,C.jade,C.dragon],1]]},
  {t:[.36,.68],win:{x:440,y:262,w:400,h:196},bars:[[0,0,.43,.194,[C.mint,C.dragon],-1],[.25,.357,.75,.204,[C.jade,C.pjade,C.jade],1],[.62,.694,.38,.184,[C.pjade,C.mint],1]]},
  {t:[.68,1.02],win:{x:300,y:212,w:680,h:296},bars:[[0,.115,.49,.155,[C.jade,C.mint,C.dragon],-1],[.145,.405,.855,.149,[C.forest,C.jade,C.mint,C.pjade],1],[0,.696,.66,.162,[C.mint,C.zinc,C.jade],-1]]},
];
// B — the burst. x,y relative to the cluster centre; drawn in this order.
const SH=[
  {k:'circle',x:-250,y:110,w:300,h:300,rot:0,path:circ,grad:{type:'rad',cx:.3,cy:.25,r:.95},ramp:[C.mint,C.pjade,C.jade,C.cam,C.deep]},
  {k:'hex',x:-140,y:215,w:230,h:170,rot:-12,path:poly([[.18,0],[.82,.06],[1,.55],[.8,1],[.12,.9],[0,.4]]),grad:{type:'lin',a:40},ramp:[C.mint,C.zinc,C.nero,C.black]},
  {k:'square',x:110,y:-150,w:200,h:200,rot:18,path:rect,grad:{type:'lin',a:90},ramp:[C.cam,C.jade,C.pjade,C.mint]},
  {k:'bar',x:50,y:40,w:300,h:26,rot:-24,path:rect,grad:{type:'lin',a:0},ramp:[C.jade,C.mint]},
  {k:'bar',x:-40,y:-20,w:220,h:20,rot:36,path:rect,grad:{type:'lin',a:0},ramp:[C.scar,C.pjade,C.mint]},
  {k:'bar',x:210,y:-20,w:180,h:18,rot:-14,path:rect,grad:{type:'lin',a:0},ramp:[C.cam,C.dragon]},
  {k:'bar',x:-80,y:130,w:28,h:150,rot:22,path:rect,grad:{type:'lin',a:90},ramp:[C.dragon,C.deep]},
  {k:'bar',x:300,y:-90,w:22,h:130,rot:-32,path:rect,grad:{type:'lin',a:90},ramp:[C.mint,C.jade]},
  {k:'bar',x:-360,y:-120,w:160,h:16,rot:12,path:rect,grad:{type:'lin',a:0},ramp:[C.forest,C.pjade]},
  {k:'star',x:170,y:160,w:500,h:500,rot:8,path:poly(starPts(9,.42,4)),grad:{type:'rad',cx:.38,cy:.35,r:.62},ramp:[C.mint,C.mint,C.pjade,C.jade,C.cam]},
  {k:'bean',x:-190,y:-170,w:150,h:260,rot:-12,path:bean,grad:{type:'lin',a:70},ramp:[C.pjade,C.mint,C.dragon]},
  {k:'bean',x:-40,y:250,w:64,h:84,rot:30,path:bean,grad:{type:'lin',a:0},ramp:[C.mint,C.pjade]},
  {k:'star',x:-320,y:-10,w:120,h:120,rot:0,path:poly(starPts(6,.5,9)),grad:{type:'rad',cx:.5,cy:.5,r:.55},ramp:[C.mint,C.dragon,C.cam]},
  {k:'circle',x:360,y:120,w:90,h:90,rot:0,path:circ,grad:{type:'rad',cx:.35,cy:.3,r:.8},ramp:[C.mint,C.zinc,C.nero]},
  {k:'mark',x:-250,y:120,w:84,h:64,rot:-8},
  {k:'mark',x:270,y:-10,w:70,h:54,rot:14},
  {k:'mark',x:-60,y:-80,w:58,h:44,rot:-18},
  {k:'mark',x:80,y:250,w:66,h:50,rot:10},
  {k:'mark',x:-420,y:170,w:48,h:37,rot:-24},
];
const ORB=[{x:-150,y:-90,rx:260,ry:66,rot:-14,sp:.9},{x:120,y:120,rx:320,ry:88,rot:10,sp:-.7}];
const SPARK=[[360,-230,16],[-390,250,12],[330,270,14],[-80,-300,10],[460,40,9]];
function build(){
  LAYOUTS.forEach((L,li)=>{L.bars=L.bars.map(([x,y,w,h,ramp,dx],bi)=>{const bw=w*L.win.w,bh=h*L.win.h;
    return {x:x*L.win.w,y:y*L.win.h,w:bw,h:bh,dx,tex:tex({w:bw,h:bh,path:rect,grad:{type:'lin',a:0},ramp,grain:.28,seed:li*10+bi+1})}})});
  SH.forEach((s,i)=>{s.tex=s.k==='mark'?markTex(s.w,s.h,.14,i+3):tex({w:s.w,h:s.h,path:s.path,grad:s.grad,ramp:s.ramp,grain:.3,seed:i+7});
    // scatter vector: away from the cluster centre, with a little randomness
    const r=rng(i*31+5),a=Math.atan2(s.y||r()-.5,s.x||r()-.5)+(r()-.5)*.5;s.dir=[Math.cos(a),Math.sin(a)];
    s.dist=900+r()*700;s.spin=(r()<.5?-1:1)*(160+r()*260);s.delay=(1-Math.min(1,Math.hypot(s.x,s.y)/420))*.12+r()*.05});
  T.grain=[0,1,2,3].map(k=>{const g=document.createElement('canvas');g.width=Math.round(W*DPR);g.height=Math.round(H*DPR);const gc=g.getContext('2d'),id=gc.createImageData(g.width,g.height),d=id.data,r=rng(300+k);
    for(let i=0;i<d.length;i+=4){const v=r()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=18}gc.putImageData(id,0,0);return g});
  const doc=new DOMParser().parseFromString(ASSETS.logo,'image/svg+xml');T.logo=[...doc.querySelectorAll('path')].map(p=>new Path2D(p.getAttribute('d')));
}
function drawTex(tx,x,y,rot=0,sc=1,alpha=1){if(sc<=.001||alpha<=0)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(rot*Math.PI/180);ctx.scale(sc,sc);ctx.drawImage(tx,-tx.w/2,-tx.h/2,tx.w,tx.h);ctx.restore()}
function sparkle(x,y,s,a){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=C.mint;ctx.beginPath();ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x,y,x+s*.35,y);ctx.quadraticCurveTo(x,y,x,y+s);ctx.quadraticCurveTo(x,y,x-s*.35,y);ctx.quadraticCurveTo(x,y,x,y-s);ctx.fill();ctx.restore()}
function line(x1,y1,x2,y2,p,w=1.5,col='rgba(244,255,247,.92)'){if(p<=0)return;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(lerp(x1,x2,p),lerp(y1,y2,p));ctx.stroke()}
// exact vector logo: mark with the SVG's gradients + mint wordmark
function drawLogo(x,y,k,glyphQ){
  ctx.save();ctx.translate(x,y);ctx.scale(k,k);
  const g0=ctx.createLinearGradient(134.086,80,12.3036,80);g0.addColorStop(0,'#124D2F');g0.addColorStop(1,'#2AB36C');
  const g1=ctx.createLinearGradient(114.285,24.1584,189.533,157.228);g1.addColorStop(0,'#2AB36C');g1.addColorStop(1,'#0F1D16');
  ctx.fillStyle=g0;ctx.fill(T.logo[0]);ctx.fillStyle=g1;ctx.fill(T.logo[1]);
  ctx.fillStyle=C.mint;for(let i=2;i<6;i++){const q=glyphQ(i);if(q<=0)continue;ctx.save();ctx.globalAlpha=q;ctx.translate(0,lerp(36,0,q));ctx.fill(T.logo[i],'evenodd');ctx.restore()}
  ctx.restore();
}

/* ============================ SCENES ============================ */
function sceneA(t){
  ctx.fillStyle=C.mint;ctx.fillRect(0,0,W,H);
  const L=LAYOUTS.find(l=>t>=l.t[0]&&t<l.t[1])||LAYOUTS[2],lt=t-L.t[0],w=L.win;
  const grow=L===LAYOUTS[2]?E.inHard(P(t,.8,1.02)):0;
  const wx=w.x-w.w*.1*grow,wy=w.y-w.h*.1*grow,ww=w.w*(1+.2*grow),wh=w.h*(1+.2*grow),sx=ww/w.w,sy=wh/w.h;
  ctx.fillStyle=C.black;ctx.fillRect(wx,wy,ww,wh);
  ctx.save();ctx.beginPath();ctx.rect(wx,wy,ww,wh);ctx.clip();
  L.bars.forEach((b,i)=>{const q=E.settle(P(lt,i*.035,.34+i*.035)),drift=lt*44*b.dx;
    const x=wx+(b.x+b.w/2)*sx+b.dx*(1-q)*w.w*.95+drift,y=wy+(b.y+b.h/2)*sy,tilt=grow*(i%2?-9:12);
    ctx.save();ctx.translate(x,y);ctx.rotate(tilt*Math.PI/180);ctx.drawImage(b.tex,-b.w/2*sx,-b.h/2*sy,b.w*sx,b.h*sy);ctx.restore()});
  ctx.restore();
}
const BC={x:640,y:380};
function sceneB(t){
  ctx.fillStyle='#0a0c0b';ctx.fillRect(0,0,W,H);
  const s0=lerp(.52,.84,E.settle(P(t,1.02,2.2))),rotC=lerp(-12,6,E.drift(P(t,1.02,2.3)));
  const blast=P(t,2.3,3.25);
  // soft tunnel rings — they rush outward with the blast
  for(let k=0;k<4;k++){const r=(150+k*200)*(1+.3*P(t,1.02,2.2))*(1+2.2*E.blast(blast));
    const g=ctx.createRadialGradient(BC.x,BC.y,Math.max(0,r-50),BC.x,BC.y,r+50);g.addColorStop(0,'rgba(84,195,138,0)');g.addColorStop(.5,`rgba(126,211,168,${.085*(1-blast)})`);g.addColorStop(1,'rgba(84,195,138,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  const a=rotC*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);
  const pos=(s,tt)=>{ // shape position (screen) at time tt
    const T0=1.02+SH.indexOf(s)*.018,q=E.settle(P(tt,T0,T0+.7));
    const fl=Math.sin(tt*1.6+s.x*.01)*6*q,lx=lerp(s.x*.1,s.x,q)+fl,ly=lerp(s.y*.1-20,s.y,q)+Math.cos(tt*1.3+s.y*.01)*5*q;
    const inh=1-.14*E.drift(P(tt,2.06,2.3))*(1-E.settle(P(tt,2.3,2.5)));   // inhale before the blast
    const bq=E.blast(P(tt,2.3+s.delay,3.05+s.delay));
    const ox=(lx*ca-ly*sa)*s0*inh,oy=(lx*sa+ly*ca)*s0*inh;
    return {x:BC.x+ox+s.dir[0]*s.dist*bq,y:BC.y+oy+s.dir[1]*s.dist*bq,q,bq};
  };
  SH.forEach((s,i)=>{const T0=1.02+i*.018;if(t<T0)return;
    const sc=E.pop(P(t,T0,T0+.55)),p=pos(s,t),rot=s.rot+rotC+(1-p.q)*140+Math.sin(t*.9+i)*3+s.spin*p.bq;
    const depth=1+1.1*p.bq,z=lerp(.2,1,sc)*s0*depth;
    // motion trail while flying out
    if(p.bq>.02&&p.bq<1)for(let k=3;k>=1;k--){const pp=pos(s,t-k*.022);drawTex(s.tex,pp.x,pp.y,rot-s.spin*.02*k,z,.16*(4-k)/3)}
    drawTex(s.tex,p.x,p.y,rot,z);
  });
  // orbit lines — widen and fade with the blast
  ctx.lineWidth=1.6;
  ORB.forEach((o,i)=>{const q=E.settle(P(t,1.25+i*.12,1.95+i*.12));if(q<=0)return;const bq=E.blast(blast);
    const lx=o.x*s0,ly=o.y*s0,x=BC.x+lx*ca-ly*sa,y=BC.y+lx*sa+ly*ca;
    ctx.strokeStyle=`rgba(244,255,247,${.9*(1-bq)})`;const a0=t*o.sp;ctx.beginPath();
    ctx.ellipse(x,y,o.rx*s0*(1+3*bq),o.ry*s0*(1+3*bq),(o.rot+rotC)*Math.PI/180,a0,a0+Math.PI*2*.78*q);ctx.stroke()});
  SPARK.forEach(([sx,sy,sz],i)=>{const d=1+2.5*E.blast(blast),x=BC.x+sx*s0*d,y=BC.y+sy*s0*d;sparkle(x,y,sz,P(t,1.5+i*.08,1.6+i*.08)*(.55+.45*Math.sin(t*9+i*2))*(1-blast))});
}
function sceneC(t){
  ctx.fillStyle='#0a0c0b';ctx.fillRect(0,0,W,H);
  const fade=1-P(t,3.72,3.9);ctx.globalAlpha=fade;
  line(640,0,640,600,E.settle(P(t,3.3,3.7)));line(0,360,900,360,E.settle(P(t,3.36,3.76)));line(200,610,1280,610,E.settle(P(t,3.42,3.82)));
  ctx.globalAlpha=1;
  const gp=P(t,3.62,4.6);if(gp<=0)return;
  const sp=lerp(256,64,E.whip(gp)),dim=lerp(.92,.3,E.drift(P(t,4.75,5.05)));
  const col=`rgba(244,255,247,${dim})`;
  for(let k=-14;k<=14;k++){const q=E.settle(P(t,3.62+Math.abs(k)*.04,4.05+Math.abs(k)*.04)),px=CX+k*sp,py=CY+k*sp;
    if(px>-2&&px<W+2)line(px,0,px,H,q,1.4,col);if(py>-2&&py<H+2)line(0,py,W,py,q,1.4,col)}
}
function sceneD(t){
  sceneC(t);
  const sp=64;
  if(t<5.3)for(let i=0;i<16;i++){const r=rng(i+11),cx=Math.floor(r()*20)-10,cy=Math.floor(r()*11)-6;if(hash(i,Math.floor(t*12))<.45)continue;
    ctx.fillStyle=r()<.6?C.jade:C.nero;ctx.fillRect(CX+cx*sp+1,CY+cy*sp+1,sp-2,sp-2)}
  // the mark, built from grid cells row by row, then collapsing into the vector logo
  const rows=4,build=P(t,4.95,5.3),out=E.whip(P(t,5.38,5.62));
  for(let j=0;j<rows;j++)for(let i=-(j+1);i<=j;i++){const on=build*rows>j+(i+j+1)/(2*j+2)*.9;if(!on)continue;
    const x=CX+i*sp,y=CY+(j-2)*sp,g=(1-out)*(sp-2);ctx.fillStyle=i<-1?C.jade:i>0?C.cam:i===-1?C.dragon:C.vegan;
    ctx.fillRect(x+1+(sp-2-g)/2,y+1+(sp-2-g)/2,g,g)}
  const lq=E.settle(P(t,5.45,6.0));if(lq<=0)return;
  const k=.8,lw=737*k,lh=198*k,lx=CX-lw/2,ly=CY-lh/2+8;
  ctx.fillStyle=`rgba(10,12,11,${.85*E.drift(P(t,5.4,5.7))})`;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.beginPath();ctx.rect(lx-20,ly-20,lw+40,(lh+40)*lq);ctx.clip();
  drawLogo(lx,ly+lerp(18,0,lq),k,i=>E.settle(P(t,5.5+i*.035,5.95+i*.035)));
  ctx.restore();
  const bq=E.whip(P(t,5.45,5.95)),pad=40,bx=lerp(40,lx-pad,bq),by=lerp(40,ly-pad,bq),bw=lerp(W-80,lw+pad*2,bq),bh=lerp(H-80,lh+pad*2,bq);
  ctx.strokeStyle=C.mint;ctx.fillStyle=C.mint;ctx.lineWidth=2;const L=18;
  [[bx,by,1,1],[bx+bw,by,-1,1],[bx,by+bh,1,-1],[bx+bw,by+bh,-1,-1]].forEach(([x,y,dx,dy])=>{ctx.beginPath();ctx.moveTo(x+dx*L,y);ctx.lineTo(x,y);ctx.lineTo(x,y+dy*L);ctx.stroke();ctx.fillRect(x-4,y-4,8,8)});
  ctx.font='10px "Space Mono"';ctx.fillStyle=`rgba(207,216,210,${P(t,5.8,5.95)})`;ctx.textAlign='left';ctx.fillText('XERG.AI',32,38);ctx.textAlign='right';ctx.fillText('DESIGN — SOLLAS',W-32,H-30);ctx.textAlign='left';
}
function render(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(t<1.02)sceneA(t);else if(t<2.95)sceneB(t);else{const u=t+SHIFT;if(u<4.75)sceneC(u);else sceneD(u)}
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(T.grain[Math.floor(t*15)%4],0,0);
}

/* ============================ BOOT ============================ */
const isRender=new URLSearchParams(location.search).has('render');
if(isRender)document.body.classList.add('render');
window.__DUR=DUR;window.__render=render;
(async()=>{
  await document.fonts.load('10px "Space Mono"');build();render(0);window.__ready=true;
  if(isRender)return;
  let playing=true,t0=performance.now(),cur=0;const btn=$('#play'),scrub=$('#scrub'),lbl=$('#time');
  const set=t=>{cur=t;render(t);scrub.value=t/DUR;lbl.textContent=t.toFixed(2)+'s'};
  const loop=now=>{if(playing)set(((now-t0)/1000)%DUR);requestAnimationFrame(loop)};requestAnimationFrame(loop);
  const toggle=()=>{playing=!playing;btn.textContent=playing?'❚❚':'▶';if(playing)t0=performance.now()-cur*1000};
  btn.onclick=toggle;scrub.oninput=()=>{playing=false;btn.textContent='▶';set(scrub.value*DUR)};
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}
    if(e.code==='ArrowRight'||e.code==='ArrowLeft'){playing=false;btn.textContent='▶';set(clamp(cur+(e.code==='ArrowRight'?1:-1)/FPS,0,DUR-1/FPS))}});
})();
</script>
