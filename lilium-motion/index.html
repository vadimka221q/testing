<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lilium Motion Study</title>
<style>
@font-face{font-family:'Archivo';src:url(fonts/archivo.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:block}
@font-face{font-family:'JB';src:url(fonts/jbmono.woff2) format('woff2');font-weight:400;font-display:block}
:root{--paper:#F1EEF1;--red:#D71E28;--ink:#0A0A0A;--grid:#BEB9BF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#141414;color:#eee;overflow:hidden;font-family:'Archivo',system-ui,sans-serif}
#viewport{position:fixed;left:0;right:0;top:0;bottom:64px}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:hidden;background:#000;transform-origin:0 0}
body.render #viewport{bottom:0}
body.render #bar{display:none}

.scene{position:absolute;inset:0;display:none;overflow:hidden}
.abs{position:absolute}
.disp{font-family:'Archivo';font-weight:500;font-stretch:125%;font-variation-settings:'wdth' 125;line-height:1;white-space:nowrap;letter-spacing:-.01em}
.mono{font-family:'JB',monospace}
.ch{display:inline-block;will-change:transform}
.lily{position:absolute;transform-origin:50% 50%}
.lily svg{display:block;width:100%;height:100%}
.lens{position:absolute;overflow:hidden}
.h{position:absolute;width:7px;height:7px;background:#fff;border:1px solid #111;transform:translate(-50%,-50%)}
.h.o{background:#fff}
.h.o::after{content:'';position:absolute;left:1.5px;top:1.5px;width:2px;height:2px;background:#111}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}

/* S1 */
#s1{background:var(--paper)}
#s1 .cam{position:absolute;inset:0;transform-origin:640px 360px}
#s1flash{position:absolute;inset:0;background:var(--red);display:none}
.s1title{position:absolute;left:0;width:1280px;top:388px;text-align:center;font-size:104px;color:var(--ink);overflow:hidden;padding:4px 0 10px}
.tag{position:absolute;left:475px;top:506px;height:19px;background:var(--red);color:#fff;font:9px/19px 'JB',monospace;padding:0 9px;letter-spacing:.02em;white-space:nowrap;overflow:hidden}
.spec{position:absolute;left:838px;top:262px;font:6.2px/1.35 'JB',monospace;color:#222;white-space:pre}
.sideLily{position:absolute}
.sideLily svg{display:block;width:100%;height:100%}

/* S2 */
#s2{background:#000}
.lensBox{position:absolute;border:1px solid rgba(255,255,255,.95)}
.lensLbl{position:absolute;left:-1px;top:-19px;font-size:12px;color:#fff;font-family:'Archivo';font-stretch:110%;letter-spacing:.01em;white-space:nowrap}

/* S3 */
#s3{background:var(--red)}
.card{position:absolute}
.card .img{position:absolute;inset:0;overflow:hidden;background:#000}
.card .img > div{position:absolute}
.card .part svg{display:block;width:100%;height:100%}
.card .lbl{position:absolute;left:-2px;top:-20px;font-size:12.5px;color:#fff;font-family:'Archivo';font-stretch:108%;white-space:nowrap}
.bloomL{position:absolute;font-size:150px;color:#fff}

/* S4 */
#s4a{background:#000}
#s4b{background:var(--paper)}
.big{position:absolute;color:var(--red)}

/* S5 */
#s5{background:#000;background-image:radial-gradient(circle,#5a5a5a 1.1px,transparent 1.6px);background-size:64px 64px;background-position:22px 30px}
.wordW{position:absolute;color:#fff;font-size:210px}
#s5trace{position:absolute;inset:0;display:none;background:#050505;background-image:linear-gradient(#161616 1px,transparent 1px),linear-gradient(90deg,#161616 1px,transparent 1px);background-size:22px 22px}
.tl{position:absolute;font:7.5px 'JB',monospace;color:#cfd3dc;letter-spacing:.04em;text-transform:uppercase}
#s5flash{position:absolute;inset:0;display:none;background:var(--red)}

/* S6 */
#s6{background:#000}
#s6 .cam{position:absolute;inset:0;transform-origin:640px 360px}
.hr{position:absolute;width:9px;height:9px;background:var(--red);transform:translate(-50%,-50%)}

/* UI */
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;background:#0c0c0c;border-top:1px solid #222;font:12px 'JB',monospace;color:#aaa}
#bar button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border:1px solid #333;border-radius:50%;color:#fff}
#bar button:hover{border-color:var(--red)}
#bar input{flex:1;accent-color:var(--red)}
#bar .brand{color:#fff;letter-spacing:.08em}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div class="scene" id="s1"><div class="cam"></div><div id="s1flash"></div></div>
  <div class="scene" id="s2"></div>
  <div class="scene" id="s3"></div>
  <div class="scene" id="s4a"></div>
  <div class="scene" id="s4b"></div>
  <div class="scene" id="s5"></div>
  <div class="scene" id="s6"><div class="cam"></div></div>
  <canvas id="fx" width="1280" height="720"></canvas>
</div></div>
<div id="bar">
  <button id="play" aria-label="Play / pause">❚❚</button>
  <span id="time">0.00s</span>
  <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0" aria-label="Timeline">
  <span class="brand">LILIUM · SPECIMEN_01</span>
</div>
<script>
/* ============================================================
   LILIUM — motion study
   Everything is a pure function of time: render(t).
   Preview: open in a browser.  Render: node render.cjs
   ============================================================ */
const W=1280,H=720,FPS=30,DUR=7.8;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  outExpo:x=>x>=1?1:1-Math.pow(2,-10*x),
  inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  outCubic:x=>1-Math.pow(1-x,3),
  inCubic:x=>x*x*x,
  inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  outQuart:x=>1-Math.pow(1-x,4),
  outBack:x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(a,b=0,c=0){let h=Math.imul((a|0)^0x9e3779b9,0x85ebca6b)^Math.imul((b|0)+0x632be5ab,0xc2b2ae35)^Math.imul((c|0)+0x27d4eb2f,0x165667b1);h^=h>>>15;h=Math.imul(h,0x2c1b3c6d);h^=h>>>12;h=Math.imul(h,0x297a2d39);h^=h>>>15;return (h>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return lerp(lerp(a,b,u),lerp(c,d,u),v)}
const $=(sel,root=document)=>root.querySelector(sel);
const $$=(sel,root=document)=>[...root.querySelectorAll(sel)];
function el(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
function place(e,x,y,w,h){const s=e.style;s.left=x+'px';s.top=y+'px';if(w!=null)s.width=w+'px';if(h!=null)s.height=h+'px'}
function show(e,on){e.style.display=on?'block':'none'}
function letters(e){const txt=e.textContent;e.textContent='';return [...txt].map(c=>el('span','ch',e,c===' '?'&nbsp;':c))}

/* ---------------- procedural lily ---------------- */
const fx2=v=>Math.round(v*100)/100;
function smoothPath(pts,closed=true){
  const n=pts.length;let d=`M${fx2(pts[0][0])} ${fx2(pts[0][1])}`;
  const g=i=>closed?pts[(i+n)%n]:pts[Math.max(0,Math.min(n-1,i))];
  for(let i=0;i<(closed?n:n-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    d+=`C${fx2(p1[0]+(p2[0]-p0[0])/6)} ${fx2(p1[1]+(p2[1]-p0[1])/6)} ${fx2(p2[0]-(p3[0]-p1[0])/6)} ${fx2(p2[1]-(p3[1]-p1[1])/6)} ${fx2(p2[0])} ${fx2(p2[1])}`}
  return closed?d+'Z':d;
}
// A petal grown along a curling midline. Base at (0,0), pointing up (-y).
function petal({L=100,W=30,curl=0,bend=0,steps=44,ruffle=.04,seed=1,shape=.75,pinch=.85}){
  const r=rng(seed),ph=r()*6.28,fr=16+r()*12;
  let x=0,y=0;const mid=[],L1=[],R1=[],ws=[],phis=[];const ds=L/steps;
  for(let i=0;i<=steps;i++){const s=i/steps,phi=bend*s+curl*s*s;
    if(i>0){x+=Math.sin(phi)*ds;y-=Math.cos(phi)*ds}
    let w=W*Math.pow(Math.sin(Math.PI*Math.pow(s,shape)),pinch);w*=1+ruffle*Math.sin(s*fr+ph)*s;
    const nx=Math.cos(phi),ny=Math.sin(phi);mid.push([x,y]);ws.push(w);phis.push(phi);
    L1.push([x-nx*w/2,y-ny*w/2]);R1.push([x+nx*w/2,y+ny*w/2])}
  const at=(s,u)=>{const i=Math.round(s*steps),m=mid[i],w=ws[i],ph=phis[i];return [m[0]+Math.cos(ph)*u*w,m[1]+Math.sin(ph)*u*w]};
  return {d:smoothPath([...L1,...R1.slice(1,-1).reverse()]),mid,at,tip:[x,y]};
}
const PAL={
  red:{g:['#2b0007','#7a0916','#c9172a','#e92d38','#ff6b5d'],shadeD:'rgba(35,0,6,.55)',shadeL:'rgba(255,214,204,.30)',edge:'rgba(70,0,12,.35)',rib:'rgba(255,205,195,.22)',vein:'rgba(90,0,14,.16)',spot:'#5a0511',throat:'#c7c64a',fil:'#e5d9a0',anth:'#46130a',anthHi:'#c65a1f',stig:'#6a0b19',stemA:'#355d1a',stemB:'#86ab3d',bud:['#3a5a16','#8f9a2e','#c4492a','#dd3a2e']},
  blue:{g:['#020a3c','#0c2da3','#2f7ee9','#8fc4ff','#f5faff'],shadeD:'rgba(0,12,70,.5)',shadeL:'rgba(255,255,255,.38)',edge:'rgba(0,20,90,.28)',rib:'rgba(255,255,255,.6)',vein:'rgba(255,255,255,.22)',spot:'#0a247d',throat:'#ffffff',fil:'#dcecff',anth:'#0a1a72',anthHi:'#6aa3ff',stig:'#0b2b8c',stemA:'#8fbfff',stemB:'#f2f8ff'},
  xray:{g:['rgba(255,255,255,.02)','rgba(200,215,255,.05)','rgba(210,225,255,.13)','rgba(225,235,255,.28)','rgba(240,246,255,.5)'],shadeD:'rgba(0,0,0,0)',shadeL:'rgba(255,255,255,.2)',edge:'rgba(236,242,255,.78)',rib:'rgba(255,255,255,.55)',vein:'rgba(230,238,255,.35)',spot:null,throat:'rgba(255,255,255,.35)',fil:'rgba(255,255,255,.6)',anth:'rgba(255,255,255,.12)',anthHi:'rgba(255,255,255,.85)',stig:'rgba(255,255,255,.45)',stemA:'rgba(255,255,255,.4)',stemB:'rgba(255,255,255,.7)'},
};
let UID=0;
function petalDefs(id,p){
  return `<radialGradient id="${id}r" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="112">${p.g.map((c,i)=>`<stop offset="${[0,.15,.42,.76,1][i]}" stop-color="${c}"/>`).join('')}</radialGradient>
  <linearGradient id="${id}s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${p.shadeD}"/><stop offset=".42" stop-color="${p.shadeD}" stop-opacity="0"/><stop offset=".6" stop-color="${p.shadeL}" stop-opacity="0"/><stop offset="1" stop-color="${p.shadeL}"/></linearGradient>
  <linearGradient id="${id}t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.shadeD}"/><stop offset=".3" stop-color="${p.shadeD}" stop-opacity="0"/></linearGradient>
  <linearGradient id="${id}h" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${p.throat}" stop-opacity=".95"/><stop offset="1" stop-color="${p.throat}" stop-opacity="0"/></linearGradient>`;
}
function petalMarkup(id,p,pt,{spots=0,r,veins=true,throat=null}){
  let s=`<path d="${pt.d}" fill="url(#${id}r)" stroke="${p.edge}" stroke-width=".6"/><path d="${pt.d}" fill="url(#${id}s)"/><path d="${pt.d}" fill="url(#${id}t)"/>`;
  if(throat)s+=`<path d="${throat.d}" fill="url(#${id}h)"/>`;
  if(veins)for(const u of [-.34,-.18,.18,.34]){const pts=[];for(let k=.06;k<=.86;k+=.08)pts.push(pt.at(k,u*(1-k*.3)));s+=`<path d="${smoothPath(pts,false)}" fill="none" stroke="${p.vein}" stroke-width=".55"/>`}
  s+=`<path d="${smoothPath(pt.mid.slice(1,-5),false)}" fill="none" stroke="${p.rib}" stroke-width="1.1" stroke-linecap="round"/>`;
  if(p.spot)for(let k=0;k<spots;k++){const q=pt.at(.1+r()*.38,(r()-.5)*.62);s+=`<circle cx="${fx2(q[0])}" cy="${fx2(q[1])}" r="${fx2(.45+r()*1)}" fill="${p.spot}" opacity="${fx2(.45+r()*.45)}"/>`}
  return s;
}
// Top-down lily: 6 tepals, stamens, pistil.
function lilySVG(o={}){
  const {pal='red',seed=7,vb='-118 -118 236 236',bg=null,stamens=true,wh=''}=o;
  const p=PAL[pal],id='L'+(UID++),r=rng(seed*97+3);
  let g='';
  for(const i of [0,2,4,1,3,5]){
    const outer=i%2===0,ang=i*60+15+(r()*10-5);
    const curl=(r()-.5)*.55,bend=(r()-.5)*.22;
    const pt=petal({L:outer?106:98,W:outer?44:58,curl,bend,seed:seed*13+i,shape:outer?.78:.66,pinch:.7,ruffle:outer?.035:.07});
    const th=petal({L:46,W:outer?7:10,curl:curl*.2,bend:bend*.45,seed:2,ruffle:0});
    g+=`<g transform="rotate(${fx2(ang)})">${petalMarkup(id,p,pt,{spots:outer?9:20,r,throat:th})}</g>`;
  }
  g+=`<circle r="22" fill="url(#${id}c)"/>`;
  if(stamens){
    for(let k=0;k<6;k++){const a=(k*60+45+r()*16)*Math.PI/180,len=50+r()*11,ex=Math.cos(a)*len,ey=Math.sin(a)*len,cx=Math.cos(a+.38)*len*.52,cy=Math.sin(a+.38)*len*.52;
      g+=`<path d="M0 0Q${fx2(cx)} ${fx2(cy)} ${fx2(ex)} ${fx2(ey)}" fill="none" stroke="${p.fil}" stroke-width="1.5" stroke-linecap="round"/>`;
      g+=`<ellipse cx="${fx2(ex)}" cy="${fx2(ey)}" rx="7.2" ry="2.4" transform="rotate(${fx2(a*180/Math.PI+90)} ${fx2(ex)} ${fx2(ey)})" fill="${p.anth}" stroke="${p.anthHi}" stroke-width=".7"/>`;
      for(let q=0;q<4;q++)g+=`<circle cx="${fx2(ex+(r()-.5)*7)}" cy="${fx2(ey+(r()-.5)*7)}" r=".7" fill="${p.anthHi}"/>`}
    const a=r()*6.28,ex=Math.cos(a)*42,ey=Math.sin(a)*42;
    g+=`<path d="M0 0Q${fx2(ex*.4+6)} ${fx2(ey*.4-4)} ${fx2(ex)} ${fx2(ey)}" fill="none" stroke="${p.fil}" stroke-width="2.3" stroke-linecap="round"/>`;
    for(let q=0;q<3;q++){const b=a+q*2.09;g+=`<circle cx="${fx2(ex+Math.cos(b)*2.4)}" cy="${fx2(ey+Math.sin(b)*2.4)}" r="2.7" fill="${p.stig}"/>`}
  }
  const defs=petalDefs(id,p)+`<radialGradient id="${id}c"><stop offset="0" stop-color="#000" stop-opacity="${pal==='xray'?0:.5}"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" preserveAspectRatio="xMidYMid slice" ${wh}>${bg?`<rect x="-999" y="-999" width="2000" height="2000" fill="${bg}"/>`:''}<defs>${defs}</defs>${g}</svg>`;
}
// Side view lily on a stem (S1 specimen)
function sideLilySVG({pal='red',seed=3}={}){
  const p=PAL[pal],id='L'+(UID++),r=rng(seed);const cx=100,cy=122;
  const pet=(a,L,Wd,curl,dark,sd)=>{const pt=petal({L,W:Wd,curl,seed:sd,shape:.72,ruffle:.05});
    return `<g transform="translate(${cx} ${cy}) rotate(${a})"><path d="${pt.d}" fill="url(#${id}v)" stroke="${p.edge}" stroke-width=".5"/><path d="${pt.d}" fill="url(#${id}s)"/>${dark?`<path d="${pt.d}" fill="#000" opacity="${dark}"/>`:''}<path d="${smoothPath(pt.mid.slice(1,-6),false)}" fill="none" stroke="${p.rib}" stroke-width=".8"/></g>`};
  let g=`<path d="M100 120C97 175 107 250 101 380" fill="none" stroke="url(#${id}st)" stroke-width="3.4" stroke-linecap="round"/>`;
  g+=`<path d="M102 232q9-6 13-16M100 300q-8-5-11-14" fill="none" stroke="url(#${id}st)" stroke-width="1.6" stroke-linecap="round"/>`;
  g+=pet(-30,68,21,-1.1,.42,11)+pet(28,70,21,1.1,.42,12)+pet(3,64,23,.25,.3,13);
  for(let k=0;k<6;k++){const dx=-30+k*12+(r()-.5)*6,ty=cy-58-r()*14;g+=`<path d="M${cx} ${cy}Q${cx+dx*.3} ${cy-30} ${fx2(cx+dx)} ${fx2(ty)}" fill="none" stroke="${p.fil}" stroke-width="1.1"/><ellipse cx="${fx2(cx+dx)}" cy="${fx2(ty)}" rx="5" ry="1.9" transform="rotate(${fx2(dx*1.2)} ${fx2(cx+dx)} ${fx2(ty)})" fill="${p.anth}" stroke="${p.anthHi}" stroke-width=".5"/>`}
  g+=`<path d="M${cx} ${cy}Q${cx+4} ${cy-40} ${cx+2} ${cy-74}" fill="none" stroke="${p.fil}" stroke-width="1.8"/><circle cx="${cx+2}" cy="${cy-75}" r="2.6" fill="${p.stig}"/>`;
  g+=pet(-64,74,25,-1.5,0,14)+pet(62,76,25,1.6,0,15)+pet(-4,50,27,-.4,.05,16);
  g+=`<ellipse cx="${cx}" cy="${cy+2}" rx="5" ry="3.5" fill="${p.stemA}"/>`;
  const defs=petalDefs(id,p)+`<linearGradient id="${id}v" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${p.g[1]}"/><stop offset=".25" stop-color="${p.g[2]}"/><stop offset=".7" stop-color="${p.g[3]}"/><stop offset="1" stop-color="${p.g[4]}"/></linearGradient>
  <linearGradient id="${id}st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.stemA}"/><stop offset=".5" stop-color="${p.stemB}"/><stop offset="1" stop-color="${p.stemA}"/></linearGradient>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 380"><defs>${defs}</defs>${g}</svg>`;
}
/* close-up "photo" crops for the anatomy cards */
function partSVG(kind){
  const p=PAL.red,id='P'+(UID++);let g='',defs=petalDefs(id,p);
  const wrap=(inner)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#050505"/><defs>${defs}</defs>${inner}</svg>`;
  if(kind==='bud'){
    const pt=petal({L:96,W:31,shape:.5,pinch:.7,curl:.15,seed:4,ruffle:0});
    defs+=`<linearGradient id="${id}b" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f4a12"/><stop offset=".35" stop-color="#8d9a2c"/><stop offset=".7" stop-color="#c8502a"/><stop offset="1" stop-color="#e0392d"/></linearGradient>`;
    g=`<path d="M8 104 Q16 94 24 88" stroke="#3d5a18" stroke-width="5" fill="none"/><g transform="translate(22 90) rotate(40)"><path d="${pt.d}" fill="url(#${id}b)"/><path d="${pt.d}" fill="url(#${id}s)"/>`;
    for(const u of [-.3,-.08,.16,.36]){const pts=[];for(let k=.04;k<=.97;k+=.07)pts.push(pt.at(k,u*(1-k*.6)));g+=`<path d="${smoothPath(pts,false)}" fill="none" stroke="rgba(25,35,5,.45)" stroke-width=".8"/>`}
    g+=`<path d="${smoothPath([pt.at(.08,.26),pt.at(.4,.28),pt.at(.8,.18)],false)}" fill="none" stroke="rgba(255,240,190,.45)" stroke-width="1.2"/></g>`;
  }else if(kind==='tepal'){
    const pt=petal({L:175,W:88,curl:1.1,bend:.2,seed:9,shape:.65,ruffle:.05});
    g=`<g transform="translate(6 128) rotate(12) scale(1.02)">${petalMarkup(id,p,pt,{spots:30,r:rng(5)})}</g>`;
    g=g.replace(`url(#${id}r)`,`url(#${id}g)`);
    defs+=`<linearGradient id="${id}g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#5c0512"/><stop offset=".45" stop-color="#c3172a"/><stop offset=".8" stop-color="#ee3a3e"/><stop offset="1" stop-color="#ff7a68"/></linearGradient>`;
  }else if(kind==='stigma'){
    const rr=rng(21);

/* ---------------- raster of the lily for pixel effects ---------------- */
let LILY_PX=null;
function buildRaster(){
  return new Promise(res=>{const N=56,img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');x.drawImage(img,0,0,N,N);
      const d=x.getImageData(0,0,N,N).data,cells=[];for(let j=0;j<N;j++)for(let i=0;i<N;i++){const a=d[(j*N+i)*4+3];if(a>90)cells.push([i,j])}
      LILY_PX={N,cells};res()};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(lilySVG({pal:'red',seed:7,wh:'width="56" height="56"'}))});
}
function pixelLily(ctx,cx,cy,size,{color='#fff',p=1,squash=1,gap=.14,seed=1,jitter=0,t=0,alt=null}={}){
  if(!LILY_PX)return;const {N,cells}=LILY_PX,cs=size/N,fr=Math.floor(t*30);
  for(let k=0;k<cells.length;k++){const [i,j]=cells[k];if(hash(i,j,seed)>p)continue;
    let x=cx-size/2+i*cs,y=cy+(j*cs-size/2)*squash;
    if(jitter&&hash(j,fr,seed)<.25)x+=(hash(i,j,fr)-.5)*jitter;
    ctx.fillStyle=alt&&hash(i,j,seed+7)<.3?alt:color;
    ctx.fillRect(x,y,cs*(1-gap),cs*squash*(1-gap))}
}
function pixelWipe(ctx,p,{cell=16,seed=1,mode='white',exclude=[]}={}){
  if(p<=0)return;
  for(let y=0;y<H;y+=cell)for(let x=0;x<W;x+=cell){
    const cxn=x/cell,cyn=y/cell;
    const v=vnoise(cxn*.11,cyn*.11,seed)*.72+hash(cxn,cyn,seed)*.28;
    if(v>p*1.08)continue;
    if(exclude.some(r=>x+cell>r.x&&x<r.x+r.w&&y+cell>r.y&&y<r.y+r.h))continue;
    if(mode==='red'){ctx.fillStyle='#D71E28';ctx.fillRect(x,y,cell,cell);continue}
    const q=vnoise(cxn*.23,cyn*.23,seed+9);
    if(q<.42){ctx.fillStyle='#fff';ctx.fillRect(x,y,cell,cell);ctx.fillStyle='#111';ctx.fillRect(x,y+4,cell,1.6);ctx.fillRect(x,y+10,cell,1.6)}
    else if(q<.62){ctx.fillStyle='#000';ctx.fillRect(x,y,cell,cell);ctx.fillStyle='#fff';for(let a=0;a<2;a++)for(let b=0;b<2;b++)ctx.fillRect(x+3+a*8,y+3+b*8,2.6,2.6)}
    else{ctx.fillStyle='#fff';ctx.fillRect(x,y,cell,cell)}
  }
}
